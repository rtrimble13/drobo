name: Publish Python

on:
  push:
    tags:
      - 'v*'                      # Only run on version tags, e.g., v1.2.3

jobs:
    pypi-publish:
        name: Publish to PyPI
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.13'

            - name: Check the tag matches the packaged version
              run: |
                TAG="${GITHUB_REF_NAME#v}"
                PKG=$(python -c "import tomllib,pathlib; \
                  print(tomllib.loads(pathlib.Path('pyproject.toml') \
                  .read_text())['project']['version'])")
                echo "tag=$TAG pyproject=$PKG"
                if [ "$TAG" != "$PKG" ]; then
                  echo "::error::tag $TAG does not match pyproject version $PKG"
                  exit 1
                fi

            - name: Build distributions
              run: |
                python -m pip install --upgrade pip build
                python -m build

            - name: Verify distributions were produced
              run: |
                ls -l dist/
                test -n "$(ls -A dist/ 2>/dev/null)" || {
                  echo "::error::dist/ is empty, nothing to publish"; exit 1; }

            - name: Publish package distributions to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
